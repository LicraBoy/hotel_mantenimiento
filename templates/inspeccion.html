{% extends "base.html" %}
{% set active_page = 'habitaciones' %}
{% block title %}Inspección — Hotel Mantenimiento{% endblock %}

{% block content %}
<div class="topbar" data-aos="fade-down">
    <div>
        <h1>Inspección de Habitación #{{ habitacion[1] }}</h1>
        <span class="subtitle">Estado actual: <span class="badge badge-amber">{{ habitacion[2] }}</span></span>
    </div>
</div>

<div class="card" data-aos="fade-up" style="max-width:600px;">
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label>Empleado</label>
                <input type="text" name="empleado" value="{{ empleado_nombre }}" required>
            </div>
            <div class="form-group">
                <label>Observaciones</label>
                <textarea name="observaciones" placeholder="Describe el estado de la habitación y cualquier problema encontrado" required></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>¿Genera mantenimiento?</label>
                    <select name="genera" id="generaSelect">
                        <option value="0">No — Todo en orden</option>
                        <option value="1">Sí — Requiere mantenimiento</option>
                    </select>
                </div>
                <div class="form-group" id="prioridadGroup" style="display:none;">
                    <label>Prioridad</label>
                    <select name="prioridad">
                        <option value="Baja">Baja</option>
                        <option value="Media" selected>Media</option>
                        <option value="Alta">Alta</option>
                        <option value="Crítica">Crítica</option>
                    </select>
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">✅ Registrar Inspección</button>
                <a href="/dashboard" class="btn btn-secondary">← Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('generaSelect').addEventListener('change', function() {
    document.getElementById('prioridadGroup').style.display = this.value === '1' ? 'block' : 'none';
});
</script>
{% endblock %}
