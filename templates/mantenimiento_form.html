{% extends "base.html" %}
{% set active_page = 'mantenimientos' %}
{% block title %}Nuevo Mantenimiento — Hotel Mantenimiento{% endblock %}

{% block content %}
<div class="topbar" data-aos="fade-down">
    <div>
        <h1>Nuevo Mantenimiento</h1>
        <span class="subtitle">Registrar mantenimiento para habitación</span>
    </div>
</div>

<div class="card" data-aos="fade-up" style="max-width:650px;">
    <div class="card-body">
        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label>Tipo</label>
                    <select name="tipo">
                        <option value="Correctivo">Correctivo</option>
                        <option value="Preventivo">Preventivo</option>
                        <option value="Emergencia">Emergencia</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Elemento</label>
                    <input type="text" name="elemento" placeholder="Ej: Aire acondicionado, Plomería" required>
                </div>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea name="descripcion" placeholder="Describe el problema o trabajo realizado"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Técnico</label>
                    <input type="text" name="tecnico" placeholder="Nombre del técnico">
                </div>
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" name="fecha" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Estado</label>
                    <select name="estado">
                        <option value="En proceso">En proceso</option>
                        <option value="Completado">Completado</option>
                        <option value="Pendiente">Pendiente</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Costo ($)</label>
                    <input type="number" name="costo" step="0.01" min="0" value="0" required>
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">💾 Registrar Mantenimiento</button>
                <a href="/mantenimientos" class="btn btn-secondary">← Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
